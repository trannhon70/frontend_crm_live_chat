name: Deploy React Vite (PM2 - Port 3005)

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Deploy to Server via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          script: |
            set -e

            echo "===== START DEPLOY ====="

            cd /www/wwwroot/frontend_crm_live_chat || exit 1

            git config --global --add safe.directory /www/wwwroot/frontend_crm_live_chat
            git pull origin main

            # ✅ cài nhanh hơn
            npm ci

            # ✅ build React
            npm run build

            # ✅ stop nếu đã chạy
            /www/server/nodejs/v24.15.0/bin/pm2 delete frontend_crm_live_chat || true

            # ✅ chạy static bằng PM2 port 3005
            /www/server/nodejs/v24.15.0/bin/pm2 serve dist 3005 --name frontend_crm_live_chat --spa

            /www/server/nodejs/v24.15.0/bin/pm2 save

            echo "===== DEPLOY DONE ====="